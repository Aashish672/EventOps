services:
  postgres:
    image: postgres:16-alpine
    container_name: eventops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventops_db}
      POSTGRES_USER: ${POSTGRES_USER:-eventops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventops_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventops} -d ${POSTGRES_DB:-eventops_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventops-network

  redis:
    image: redis:7-alpine
    container_name: eventops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventops-network

networks:
  eventops-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
